name: Update og images

on:
  schedule:
    # Runs at 00:05 AM UTC every day
    - cron: '5 0 * * *'
  workflow_dispatch:
jobs:
  update_og_images:
    # Keep the runner compatible with the locked Playwright browser builds.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      # Install dependencies
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Update og images
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_PROMPT_ID: ${{ secrets.OPENAI_PROMPT_ID }}
        run: npm run update-og-images
